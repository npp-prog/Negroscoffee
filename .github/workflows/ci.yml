# Checks every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, types, formatting
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Unit tests
        run: npm test

      - name: Install psql client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client

      - name: Database tests (migrations, seed, RLS, search)
        run: npm run db:test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build + smoke tests (no keys needed)
        run: npm run e2e -- --trace off
